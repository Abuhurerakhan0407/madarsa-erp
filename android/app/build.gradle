plugins {
    id 'com.android.application'
}

def releaseStoreFilePath = System.getenv("ILMGAH_RELEASE_STORE_FILE") ?: "../signing/ilmgaah-release.jks"
def releaseStoreFile = file(releaseStoreFilePath)
def releaseStorePassword = System.getenv("ILMGAH_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ILMGAH_RELEASE_KEY_ALIAS") ?: "ilmgaah"
def releaseKeyPassword = System.getenv("ILMGAH_RELEASE_KEY_PASSWORD")

android {
    namespace 'in.ilmgaah.app'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'in.ilmgaah.app'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile releaseStoreFile
            storePassword releaseStorePassword ?: ""
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.configureEach {
    if (name in ["validateSigningRelease", "packageRelease", "bundleRelease"]) {
        doFirst {
            if (!releaseStoreFile.isFile()) {
                throw new GradleException("Release signing key missing. Supply the existing key via ILMGAH_RELEASE_STORE_FILE or android/signing/ilmgaah-release.jks.")
            }
            if (!releaseStorePassword || !releaseKeyPassword) {
                throw new GradleException("Release signing requires ILMGAH_RELEASE_STORE_PASSWORD and ILMGAH_RELEASE_KEY_PASSWORD environment variables. Do not store signing passwords in source control.")
            }
        }
    }
}

dependencies {
}
