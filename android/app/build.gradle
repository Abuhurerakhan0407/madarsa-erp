plugins {
    id 'com.android.application'
}

android {
    namespace 'in.ilmgaah.app'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'in.ilmgaah.app'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
