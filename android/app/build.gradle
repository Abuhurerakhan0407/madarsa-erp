plugins {
    id 'com.android.application'
}

android {
    namespace 'in.ilmgaah.app'
    compileSdk 36

    defaultConfig {
        applicationId 'in.ilmgaah.app'
        minSdk 23
        targetSdk 36
        versionCode 6
        versionName '1.2.1-qa'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
