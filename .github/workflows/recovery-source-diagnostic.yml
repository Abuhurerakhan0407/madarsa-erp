name: Recovery source diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DB_URL: ${{ secrets.MADARSA_ERP_DATABASE_URL }}
      SUPABASE_CLI_VERSION: "2.116.0"
      SUPABASE_CLI_DEB_SHA256: "82cb424bc13cd029a66cb43bc537315cee9068cc6237b7d4b7f8f8949800d251"
      PGCONNECT_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.deb" \
            -o /tmp/supabase.deb
          echo "${SUPABASE_CLI_DEB_SHA256}  /tmp/supabase.deb" | sha256sum -c -
          sudo dpkg -i /tmp/supabase.deb
          supabase --version

      - name: Run sanitized source probes
        id: probes
        shell: bash
        run: |
          set -u -o pipefail

          OUTPUT_DIR="recovery-source-diagnostic"
          mkdir -p "${OUTPUT_DIR}"
          RESULT_FILE="${OUTPUT_DIR}/result.txt"
          : > "${RESULT_FILE}"
          FAILED=0

          SOURCE_DB_URL="$(
            python3 <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          raw = os.environ["SOURCE_DB_URL"]
          parts = urlsplit(raw)
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["connect_timeout"] = "10"
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)))
          PY
          )"
          export SOURCE_DB_URL

          classify_error() {
            local file="$1"
            if grep -Eqi 'password authentication failed|authentication failed|SASL|SCRAM' "${file}"; then
              printf '%s' 'authentication'
            elif grep -Eqi 'timed out|timeout|network is unreachable|could not connect|connection refused|connection reset|server closed|SSL SYSCALL|unexpected EOF|could not translate host name|name or service not known' "${file}"; then
              printf '%s' 'connectivity'
            elif grep -Eqi 'permission denied|must be owner|insufficient privilege' "${file}"; then
              printf '%s' 'permissions'
            else
              printf '%s' 'command_failure'
            fi
          }

          record_ok() {
            printf '%s=ok\n' "$1" >> "${RESULT_FILE}"
          }

          record_failure() {
            local stage="$1"
            local err_file="$2"
            local exit_code="$3"
            local classification
            if [[ "${exit_code}" -eq 124 ]]; then
              classification='timeout'
            else
              classification="$(classify_error "${err_file}")"
            fi
            printf '%s=%s\n' "${stage}" "${classification}" >> "${RESULT_FILE}"
            FAILED=1
          }

          if timeout 30s psql "${SOURCE_DB_URL}" -X -v ON_ERROR_STOP=1 -Atc 'select 1' >/dev/null 2>/tmp/source-psql.err; then
            record_ok source_psql
          else
            rc=$?
            record_failure source_psql /tmp/source-psql.err "${rc}"
          fi
          rm -f /tmp/source-psql.err

          if [[ "${FAILED}" -eq 0 ]]; then
            if timeout 180s supabase db dump --db-url "${SOURCE_DB_URL}" -f /tmp/roles.sql --role-only >/dev/null 2>/tmp/roles.err; then
              record_ok roles_dump
            else
              rc=$?
              record_failure roles_dump /tmp/roles.err "${rc}"
            fi
            rm -f /tmp/roles.sql /tmp/roles.err
          else
            printf '%s\n' 'roles_dump=skipped_after_source_failure' >> "${RESULT_FILE}"
          fi

          if [[ "${FAILED}" -eq 0 ]]; then
            if timeout 180s supabase db dump --db-url "${SOURCE_DB_URL}" -f /tmp/schema.sql >/dev/null 2>/tmp/schema.err; then
              record_ok schema_dump
            else
              rc=$?
              record_failure schema_dump /tmp/schema.err "${rc}"
            fi
            rm -f /tmp/schema.sql /tmp/schema.err
          else
            printf '%s\n' 'schema_dump=skipped_after_prior_failure' >> "${RESULT_FILE}"
          fi

          if [[ "${FAILED}" -eq 0 ]]; then
            if timeout 180s supabase db dump --db-url "${SOURCE_DB_URL}" -f /tmp/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes" >/dev/null 2>/tmp/data.err; then
              record_ok data_dump
            else
              rc=$?
              record_failure data_dump /tmp/data.err "${rc}"
            fi
            rm -f /tmp/data.sql /tmp/data.err
          else
            printf '%s\n' 'data_dump=skipped_after_prior_failure' >> "${RESULT_FILE}"
          fi

          if [[ "${FAILED}" -eq 0 ]]; then
            printf '%s\n' 'overall=ok' >> "${RESULT_FILE}"
          else
            printf '%s\n' 'overall=failed' >> "${RESULT_FILE}"
          fi

          # Never print the source URL or raw command stderr. The artifact contains only
          # sanitized stage classifications from the fixed allow-list above.
          cat "${RESULT_FILE}"

          if [[ "${FAILED}" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload sanitized diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-source-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-source-diagnostic/result.txt
          if-no-files-found: error
          retention-days: 3
