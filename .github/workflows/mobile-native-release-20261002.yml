name: Ilmgaah Bundled Native Android Build 20261002

on:
  push:
    branches:
      - mobile/native-release-20261002
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-native-release-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilmgaah-native-release-20261002
  cancel-in-progress: true

jobs:
  build:
    name: Build bundled Ilmgaah Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Build bundled mobile UI
        working-directory: mobile
        run: npm run build

      - name: Fail closed if live server configuration appears
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'server:' capacitor.config.ts; then
            echo 'ERROR: bundled native release must not contain Capacitor server.url configuration'
            exit 1
          fi
          if grep -q 'madarsa-erp.vercel.app' capacitor.config.ts; then
            echo 'ERROR: bundled native release must not point at hosted ERP'
            exit 1
          fi

      - name: Generate Android project
        working-directory: mobile
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          npm run assets:android

      - name: Harden Android security and version
        working-directory: mobile
        env:
          BUILD_NUMBER: \${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/xml

          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false">
              <trust-anchors>
                <certificates src="system" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          XML

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace('android:allowBackup="true"', 'android:allowBackup="false"', 1)
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  '<application',
                  '<application\\n        android:usesCleartextTraffic="false"',
                  1,
              )
          if 'android:networkSecurityConfig=' not in text:
              text = text.replace(
                  '<application',
                  '<application\\n        android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )
          manifest.write_text(text, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          src = gradle.read_text(encoding="utf-8")
          src = re.sub(
              r'versionCode\\s+\\d+',
              f"versionCode {os.environ['BUILD_NUMBER']}",
              src,
              count=1,
          )
          src = re.sub(
              r'versionName\\s+"[^"]+"',
              'versionName "1.1.0-native"',
              src,
              count=1,
          )
          gradle.write_text(src, encoding="utf-8")
          PY

      - name: Verify generated Android configuration
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' android/app/src/main/AndroidManifest.xml
          grep -q 'cleartextTrafficPermitted="false"' android/app/src/main/res/xml/network_security_config.xml
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle

      - name: Build APK
        working-directory: mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Verify bundled APK identity
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt

          grep -q "package: name='in.ilmgaah.app'" apk-badging.txt
          grep -q "versionCode:='\${{ github.run_number }}'" apk-badging.txt
          grep -q "versionName='1.1.0-native'" apk-badging.txt
          grep -q "targetSdkVersion:'36'" apk-badging.txt

          unzip -p "$APK" assets/capacitor.config.json > embedded-capacitor-config.json
          if grep -q '"server"' embedded-capacitor-config.json; then
            echo 'ERROR: final APK embeds Capacitor server configuration'
            cat embedded-capacitor-config.json
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/Ilmgaah-native-bundled-debug.apk
          sha256sum artifacts/Ilmgaah-native-bundled-debug.apk > artifacts/Ilmgaah-native-bundled-debug.sha256
          cp apk-signature.txt apk-badging.txt apk-permissions.txt embedded-capacitor-config.json artifacts/

          {
            echo "Source commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Mode: bundled native mobile UI"
            echo "Package: in.ilmgaah.app"
            echo "Version: 1.1.0-native"
            echo "Target SDK: 36"
            echo "Minimum SDK: 24"
            echo "Capacitor: 8.5.2"
            echo "No Capacitor server.url"
            echo "This artifact is debug-signed for internal QA; release signing is performed separately."
          } > artifacts/BUILD-INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilmgaah-native-bundled-\${{ github.run_number }}
          path: mobile/artifacts/*
          if-no-files-found: error
          retention-days: 7
