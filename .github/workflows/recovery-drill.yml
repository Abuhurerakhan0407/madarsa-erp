name: Database recovery drill

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this recovery drill is being run"
        required: true
        type: string
      target_rpo_hours:
        description: "Maximum acceptable logical-backup RPO in hours"
        required: true
        default: "24"
        type: string
  push:
    branches:
      - main
    paths:
      - scripts/recovery-drill.sh
      - scripts/recovery-scope-smoke.sh
      - scripts/recovery-application-smoke.sh
      - database/contracts/phase2_storage.sql
      - .github/workflows/recovery-drill.yml

permissions:
  contents: read

jobs:
  database-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DB_URL: ${{ secrets.MADARSA_ERP_DATABASE_URL }}
      RECOVERY_PASSPHRASE: ${{ secrets.MADARSA_ERP_RECOVERY_PASSPHRASE }}
      RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RECOVERY_OUTPUT_DIR: recovery-drill-output
      TARGET_RPO_HOURS: ${{ github.event.inputs.target_rpo_hours || '24' }}
      DRILL_REASON: ${{ github.event.inputs.reason || 'Automated recovery verification after recovery workflow change' }}
      SUPABASE_CLI_VERSION: "2.116.0"
      SUPABASE_CLI_DEB_SHA256: "82cb424bc13cd029a66cb43bc537315cee9068cc6237b7d4b7f8f8949800d251"
      PGCONNECT_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.deb" \
            -o /tmp/supabase.deb
          echo "${SUPABASE_CLI_DEB_SHA256}  /tmp/supabase.deb" | sha256sum -c -
          sudo dpkg -i /tmp/supabase.deb
          supabase --version

      - name: Start isolated initialized Supabase restore target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR="${RUNNER_TEMP}/madarsa-recovery-target"
          rm -rf "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}"

          timeout 60s supabase init --workdir "${TARGET_DIR}" >/dev/null
          timeout 600s supabase start --workdir "${TARGET_DIR}" >/dev/null

          AUTH_RELATION="$(psql "${RESTORE_DB_URL}" -X -v ON_ERROR_STOP=1 -Atc "select coalesce(to_regclass('auth.audit_log_entries')::text, 'missing')")"
          if [[ "${AUTH_RELATION}" != "auth.audit_log_entries" ]]; then
            echo "::error::Initialized restore target is missing the required Supabase Auth schema baseline."
            exit 1
          fi

      - name: Run database backup and isolated restore drill
        shell: bash
        run: |
          set -euo pipefail

          # Add a bounded libpq timeout without exposing or changing the stored secret.
          SOURCE_DB_URL="$(
            python3 <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          raw = os.environ["SOURCE_DB_URL"]
          parts = urlsplit(raw)
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["connect_timeout"] = "10"
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)))
          PY
          )"
          export SOURCE_DB_URL

          rm -rf "${RECOVERY_OUTPUT_DIR}"
          mkdir -p "${RECOVERY_OUTPUT_DIR}"
          bash scripts/recovery-drill.sh

      - name: Verify Auth and Storage recovery scope
        shell: bash
        run: bash scripts/recovery-scope-smoke.sh

      - name: Set up pnpm for restored application verification
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js for restored application verification
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tested application dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify restored application read path
        shell: bash
        env:
          LOCAL_SUPABASE_WORKDIR: ${{ runner.temp }}/madarsa-recovery-target
        run: bash scripts/recovery-application-smoke.sh

      - name: Stop isolated Supabase restore target
        if: always()
        shell: bash
        run: |
          TARGET_DIR="${RUNNER_TEMP}/madarsa-recovery-target"
          supabase stop --no-backup --workdir "${TARGET_DIR}" >/dev/null 2>&1 || true

      - name: Upload sanitized recovery stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madarsa-erp-recovery-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-drill-output/stage-status.txt
            recovery-drill-output/verification-summary.json
            recovery-drill-output/recovery-scope-smoke.json
            recovery-drill-output/application-smoke.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload encrypted logical backup
        uses: actions/upload-artifact@v4
        with:
          name: madarsa-erp-encrypted-logical-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-drill-output/database-backup.tar.gz.enc
          if-no-files-found: error
          retention-days: 7

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: madarsa-erp-recovery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-drill-output/evidence.json
            recovery-drill-output/checksums.sha256
            recovery-drill-output/recovery-scope-smoke.json
            recovery-drill-output/application-smoke.json
          if-no-files-found: error
          retention-days: 30