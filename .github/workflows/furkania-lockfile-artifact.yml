name: Furkania lockfile artifact

on:
  push:
    branches:
      - client/madrasa-e-furkania

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: furkania-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
