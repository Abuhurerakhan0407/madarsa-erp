name: Recovery dependency diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recovery-dependency-diagnostic.yml

permissions:
  contents: read

jobs:
  dependency-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      restore-db:
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: restore-drill-local-only
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      SOURCE_DB_URL: ${{ secrets.MADARSA_ERP_DATABASE_URL }}
      RESTORE_DB_URL: postgresql://supabase_admin:restore-drill-local-only@127.0.0.1:54329/postgres
      SUPABASE_CLI_VERSION: "2.116.0"
      SUPABASE_CLI_DEB_SHA256: "82cb424bc13cd029a66cb43bc537315cee9068cc6237b7d4b7f8f8949800d251"
      PGCONNECT_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.deb" \
            -o /tmp/supabase.deb
          echo "${SUPABASE_CLI_DEB_SHA256}  /tmp/supabase.deb" | sha256sum -c -
          sudo dpkg -i /tmp/supabase.deb
          supabase --version

      - name: Identify missing restore dependency safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-dependency-diagnostic /tmp/recovery-dependency
          RESULT=recovery-dependency-diagnostic/result.txt

          SOURCE_DB_URL="$(
            python3 <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          raw = os.environ['SOURCE_DB_URL']
          parts = urlsplit(raw)
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query['connect_timeout'] = '10'
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)))
          PY
          )"
          export SOURCE_DB_URL

          supabase db dump --db-url "${SOURCE_DB_URL}" -f /tmp/recovery-dependency/schema.sql >/dev/null 2>/tmp/schema.err
          supabase db dump --db-url "${SOURCE_DB_URL}" -f /tmp/recovery-dependency/data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes" >/dev/null 2>/tmp/data-dump.err
          rm -f /tmp/schema.err /tmp/data-dump.err

          psql --single-transaction --variable ON_ERROR_STOP=1 \
            --file /tmp/recovery-dependency/schema.sql \
            --dbname "${RESTORE_DB_URL}" \
            >/dev/null 2>/tmp/local-schema.err
          rm -f /tmp/local-schema.err

          set +e
          psql --single-transaction --variable ON_ERROR_STOP=1 \
            --command 'SET session_replication_role = replica' \
            --file /tmp/recovery-dependency/data.sql \
            --dbname "${RESTORE_DB_URL}" \
            >/dev/null 2>/tmp/local-data.err
          rc=$?
          set -e

          if [[ "${rc}" -eq 0 ]]; then
            printf 'status=ok\nkind=none\nname=none\n' > "${RESULT}"
          else
            python3 - /tmp/local-data.err "${RESULT}" <<'PY'
          import re
          import sys

          src, out = sys.argv[1], sys.argv[2]
          text = open(src, 'r', encoding='utf-8', errors='replace').read()
          patterns = [
              ('relation', r'relation\s+"([A-Za-z_][A-Za-z0-9_$]*(?:\.[A-Za-z_][A-Za-z0-9_$]*)?)"\s+does not exist'),
              ('type', r'type\s+"?([A-Za-z_][A-Za-z0-9_$]*(?:\.[A-Za-z_][A-Za-z0-9_$]*)?)"?\s+does not exist'),
              ('function', r'function\s+([A-Za-z_][A-Za-z0-9_$]*(?:\.[A-Za-z_][A-Za-z0-9_$]*)?)\s*\([^\n]*\)\s+does not exist'),
          ]
          kind = 'unknown'
          name = 'withheld'
          for candidate_kind, pattern in patterns:
              m = re.search(pattern, text, re.IGNORECASE)
              if m:
                  kind = candidate_kind
                  name = m.group(1)
                  break
          with open(out, 'w', encoding='utf-8') as f:
              f.write('status=failed\n')
              f.write(f'kind={kind}\n')
              f.write(f'name={name}\n')
          PY
          fi

          rm -rf /tmp/recovery-dependency /tmp/local-data.err
          cat "${RESULT}"

      - name: Upload sanitized dependency result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-dependency-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-dependency-diagnostic/result.txt
          if-no-files-found: error
          retention-days: 3
