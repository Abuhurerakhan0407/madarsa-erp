name: Ilmgaah Android QA APK

on:
  push:
    branches:
      - qa/native-login-fix-20261004
    paths:
      - "android/**"
      - ".github/workflows/android-qa-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilmgaah-android-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" >/tmp/apksigner.txt
          "$AAPT" dump badging "$APK" >/tmp/badging.txt
          grep -q "package: name='in.ilmgaah.app'" /tmp/badging.txt
          grep -q "versionCode:'6'" /tmp/badging.txt
          grep -q "versionName='1.2.1-qa'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ilmgaah-android-qa-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            /tmp/sha256.txt
            /tmp/apksigner.txt
            /tmp/badging.txt
          if-no-files-found: error
          retention-days: 7
